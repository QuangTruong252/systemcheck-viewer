  "LOAD_TUNING_TOOL_ACTIVE": "Có tiến trình tinh chỉnh xung nhịp hoặc điện áp khi bắt đầu tải. Kết quả có thể khác khi dùng cấu hình mặc định.",
  "BAT_LOW_CYCLES_VS_AGE": "Pin báo số chu kỳ sạc thấp so với tuổi máy.",

const disclosures = Object.freeze({
  CLOCK_UNVERIFIED: "Giờ cục bộ chưa được đối chiếu với nguồn giờ trực tuyến.",
  CPU_TEMP_UNSUPPORTED: "Chưa có số đo nhiệt độ CPU được hỗ trợ.",
  NET_MS_UNREACHABLE: "Mạng hiện tại chưa kết nối được với máy chủ quản trị Microsoft.",
  SKIP_4B: "Đã bỏ qua bài thử xả pin riêng.",
  NO_CLAIM: "Chưa nhập thông số người bán cam kết.",
  RAM_TEST_SKIPPED: "Đã bỏ qua bài quét RAM vì không chuẩn bị được bộ nhớ kiểm thử."
});

const verdicts = ["PASS", "WARN", "INC", "DB"];
const verdictText = { PASS: "ĐẠT", WARN: "ĐÀM PHÁN GIÁ / LƯU Ý", INC: "CHƯA ĐỦ KẾT LUẬN", DB: "LOẠI NGAY" };
const gateText = ["Đạt", "Lưu ý", "Chưa đủ kết luận", "Loại ngay", "Chưa chạy", "Không áp dụng"];
const gateNames = ["Tải CPU", "RAM khả dụng", "Đồ họa", "Lưu trữ", "Quản trị và WHEA", "Ngoại vi", "Pin"];
const endpointText = { OK: "Kết nối được", INC: "Chưa xác minh kết nối", SKIP_OFFLINE: "Bỏ qua khi ngoại tuyến" };
const localText = { OK: "Chưa ghi nhận dấu hiệu cục bộ", WARN: "Có mục cần lưu ý hoặc chưa xác minh", DB: "Có phát hiện nghiêm trọng" };
const summaryText = { model: "Dòng máy", sn: "Serial", cpu: "CPU", gpu: "GPU", ram: "RAM đã lắp", disk: "Ổ hệ thống" };
const groupText = { db: "Phát hiện nghiêm trọng", unv: "Chưa xác minh", wn: "Lưu ý" };
const groups = ["db", "unv", "wn"];
const maxUrl = 950;
const maxPrefix = 64;
const maxJson = 1024 * 1024;

class UnsupportedCompression extends Error {}

function requireValid(condition) {
  if (!condition) throw new Error("Invalid report");
}

function shape(value, keys) {
  return value !== null && typeof value === "object" && !Array.isArray(value)
    && Object.keys(value).length === keys.length && keys.every(key => Object.hasOwn(value, key));
}

function integer(value, max) {
  return Number.isInteger(value) && value >= 0 && value <= max;
}

function ascii(value, max) {
  return typeof value === "string" && value.length <= max && !/[^ -~]/.test(value);
}

function fixedArray(value, length) {
  return Array.isArray(value) && value.length === length;
}

function codeIn(map, value) {
  return typeof value === "string" && Object.hasOwn(map, value);
}

function base64Bytes(encoded) {
  requireValid(encoded.length > 0 && !/[^A-Za-z0-9_-]/.test(encoded));
  const standard = encoded.replace(/-/g, "+").replace(/_/g, "/");
  const binary = atob(standard);
  requireValid(btoa(binary).replace(/=+$/, "") === standard);
  return Uint8Array.from(binary, char => char.charCodeAt(0));
}

async function inflate(bytes) {
  // One MiB exceeds the RFC 1951 expansion possible within this QR budget.
  let stream;
  try { stream = new DecompressionStream("deflate-raw"); }
  catch { throw new UnsupportedCompression(); }
  const reader = new Blob([bytes]).stream().pipeThrough(stream).getReader();
  const decoder = new TextDecoder("utf-8", { fatal: true, ignoreBOM: true });
  let json = "";
  let length = 0;
  try {
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      length += value.length;
      requireValid(length <= maxJson);
      json += decoder.decode(value, { stream: true });
    }
    return json + decoder.decode();
  } catch (error) {
    await reader.cancel().catch(() => {});
    throw error;
  } finally {
    reader.releaseLock();
  }
}

function fullReport(value) {
  requireValid(shape(value, ["v", "cp", "ts", "pf", "vd", "hw", "ent", ...groups, "disc", "tr"]));
  requireValid(value.v === 1 && (value.cp === 1 || value.cp === 2) && integer(value.ts, 9999999999)
    && (value.pf === "L" || value.pf === "D") && verdicts.includes(value.vd));
  requireValid(shape(value.hw, Object.keys(summaryText)) && Object.values(value.hw).every(item => ascii(item, 20)));
  requireValid(shape(value.ent, ["ep", "loc", "ap"]) && codeIn(endpointText, value.ent.ep)
    && codeIn(localText, value.ent.loc) && value.ent.ap === "UNV");
  requireValid(shape(value.tr, groups) && Object.values(value.tr).every(item => integer(item, 255)));
  for (const group of groups) {
    requireValid(Array.isArray(value[group]) && value[group].every(row =>
      (shape(row, ["c"]) || (shape(row, ["c", "m"]) && ascii(row.m, 24)))
      && codeIn(findings, row.c)));
  }
  requireValid(Array.isArray(value.disc) && value.disc.every(code => codeIn(disclosures, code)));
  return value;
}

function minimalReport(tuple) {
  requireValid(fixedArray(tuple, 10));
  const [v, cp, pf, vd, ts, ent, gates, counts, serial, exportFlag] = tuple;
  requireValid(v === 1 && (cp === 1 || cp === 2) && integer(pf, 1)
    && integer(vd, 3) && integer(ts, 9999999999) && exportFlag === 1);
  requireValid(fixedArray(ent, 3) && integer(ent[0], 2) && integer(ent[1], 2) && ent[2] === 2);
  requireValid(fixedArray(gates, 7) && gates.every(gate => integer(gate, 5)));
  requireValid(fixedArray(counts, 3) && counts.every(count => integer(count, 255)));
  requireValid(typeof serial === "string" && serial.length <= 8 && !/[^A-Za-z0-9-]/.test(serial));
  return {
    cp, pf: pf === 0 ? "L" : "D", vd: verdicts[vd], ts,
    hw: { sn: serial },
    ent: { ep: ["OK", "INC", "SKIP_OFFLINE"][ent[0]], loc: ["OK", "WARN", "DB"][ent[1]], ap: "UNV" },
    gates, counts
  };
}

async function decodeReport(hash) {
  requireValid(hash.length <= maxUrl);
  if (hash.startsWith("#v1m.")) {
    const bytes = base64Bytes(hash.slice(5));
    requireValid(bytes.length <= 71 && bytes.every(byte => byte < 128));
    const json = new TextDecoder().decode(bytes);
    const tuple = JSON.parse(json);
    requireValid(JSON.stringify(tuple) === json);
    return minimalReport(tuple);
  }
  requireValid(hash.startsWith("#v1."));
  return fullReport(JSON.parse(await inflate(base64Bytes(hash.slice(4)))));
}

function add(parent, tag, label, className) {
  const element = document.createElement(tag);
  if (label !== undefined) element.textContent = label;
  if (className) element.className = className;
  parent.append(element);
  return element;
}

function panel(parent, title) {
  const section = add(parent, "section");
  add(section, "h2", title);
  return section;
}

function details(parent, rows) {
  const list = add(parent, "dl");
  for (const [label, text] of rows) {
    const row = add(list, "div");
    add(row, "dt", label);
    add(row, "dd", text);
  }
}

function countText(count) {
  return count === 255 ? "255+" : String(count);
}

const manualItems = Object.freeze({
  BATTERY_CASE: "Pin phồng / vỏ cong",
  SCREWS_SEALS: "Ốc / tem",
  PORTS: "Cổng kết nối",
  WEBCAM: "Webcam",
  WI_FI: "Wi-Fi"
});

function factoryLookup({ model, sn }) {
  // 2026-11-26: #v1m has sn8 but no vendor. Use only the full #v1 hardware summary.
  if (!model || !sn) return null;
  const serial = sn.trim().toUpperCase();
  const name = model.trim();
  // 2026-11-26: Lenovo PC Support redirected /products/{serial}/parts/display/as-built
  // to the canonical product's As-Built page on https://pcsupport.lenovo.com/ (HTTP 200).
  if (/^lenovo(?:\s|$)/i.test(name) && /^[A-Z0-9]{7,8}$/.test(serial)) {
    return {
      url: "https://pcsupport.lenovo.com/us/en/products/" + serial + "/parts/display/as-built"
    };
  }
  // 2026-11-26: Dell KB 000125283 documents Product Specifications > Original Configuration.
  // https://www.dell.com/support/kbdoc/en-us/000125283 (direct tag GET returned HTTP 403 here).
  if (/^dell(?:\s|$)/i.test(name) && /^[A-Z0-9]{7}$/.test(serial)) {
    return {
      url: "https://www.dell.com/support/product-details/en-us/servicetag/" + serial + "/overview",
      hint: "Chọn Product Specifications, rồi chọn Original Configuration."
    };
  }
  // HP PartSurfer reads searchtext from the URL and accepts a full 10-character serial.
  // https://partsurfer.hpcloud.hp.com/PartSurfer/UserGuide (2026-11-26)
  if (/^(?:hp|hewlett[- ]packard)(?:\s|$)/i.test(name) && /^[A-Z0-9]{10}$/.test(serial)) {
    return {
      url: "https://partsurfer.hpcloud.hp.com/?searchtext=" + serial,
      hint: "Mở thẻ Advanced để xem danh sách linh kiện nếu có."
    };
  }
  return null;
}

function render(report) {
  const view = document.createDocumentFragment();
  const overview = panel(view, report.cp === 1 ? "Báo cáo sơ bộ" : "Báo cáo hoàn chỉnh");
  add(overview, "p", verdictText[report.vd], "verdict " + report.vd);
  const timestamp = new Date(report.ts * 1000).toISOString().slice(0, 19).replace("T", " ") + " UTC";
  add(overview, "p", (report.pf === "L" ? "Laptop" : "Máy để bàn") + " · " + timestamp, "detail");
  if (report.cp === 1) add(overview, "p", "Kết quả sau quét cấu hình và nhật ký. Kiểm tra ngoại vi và tải chưa chạy.");

  const hardware = Object.keys(summaryText).filter(key => report.hw[key]);
  if (hardware.length) {
    const section = panel(view, "Cấu hình");
    details(section, hardware.map(key => [summaryText[key], report.hw[key]]));
    const lookup = factoryLookup(report.hw);
    if (lookup) {
      const link = add(add(section, "p"), "a", "Tra cấu hình xuất xưởng");
      link.href = lookup.url;
      link.target = "_blank";
      link.rel = "noopener noreferrer";
      if (lookup.hint) add(section, "p", lookup.hint, "detail");
    }
  }

  details(panel(view, "Quản trị thiết bị"), [
    ["Máy chủ Microsoft", endpointText[report.ent.ep]],
    ["Trạng thái cục bộ", localText[report.ent.loc]],
    ["Autopilot Cloud", "Chưa xác minh"]
  ]);

  if (report.gates) {
    details(panel(view, "Hạng mục kiểm tra"), report.gates.map((gate, index) => [gateNames[index], gateText[gate]]));
    const summary = panel(view, "Số mục phát hiện");
    details(summary, groups.map((group, index) => [groupText[group], countText(report.counts[index])]));
    add(summary, "p", "Xuất file báo cáo từ SystemCheck trên PC để xem chi tiết.");
    return view;
  }

  let omitted = false;
  for (const group of groups) {
    if (!report[group].length && !report.tr[group]) continue;
    const section = panel(view, groupText[group]);
    if (report[group].length) {
      const list = add(section, "ul");
      for (const row of report[group]) {
        const item = row.c === "PERIPH_DEFECT" && Object.hasOwn(manualItems, row.m)
          ? manualItems[row.m] : row.m;
        add(list, "li", findings[row.c] + (item === undefined ? "" : " (" + item + ")"));
      }
    }
    if (report.tr[group]) {
      omitted = true;
      add(section, "p", "Đã lược " + countText(report.tr[group]) + " mục.", "detail");
    }
  }
  if (omitted) add(view, "p", "Xuất file báo cáo từ SystemCheck trên PC để xem chi tiết.", "panel");
  if (report.disc.length) {
    const list = add(panel(view, "Phạm vi kiểm tra"), "ul");
    for (const code of report.disc) add(list, "li", disclosures[code]);
  }
  return view;
}

const status = document.getElementById("status");
const output = document.getElementById("report");
let revision = 0;

async function showReport() {
  const current = ++revision;
  const hash = location.hash;
  output.replaceChildren();
  if (!hash) {
    status.textContent = "Quét mã QR trong SystemCheck để mở báo cáo.";
    return;
  }
  status.textContent = "Đang đọc báo cáo…";
  try {
    if (location.protocol === "https:") {
      requireValid(location.href.length <= maxUrl && location.href.length - hash.length + 1 <= maxPrefix);
    }
    const report = await decodeReport(hash);
    if (current !== revision) return;
    output.replaceChildren(render(report));
    status.textContent = "Đã đọc báo cáo trên thiết bị này.";
  } catch (error) {
    if (current !== revision) return;
    status.textContent = error instanceof UnsupportedCompression
      ? "Trình duyệt này chưa hỗ trợ giải nén báo cáo. Hãy mở mã QR bằng trình duyệt mới hơn hoặc xuất file từ PC."
      : "Mã QR không hợp lệ hoặc chưa được hỗ trợ.";
  }
}
window.addEventListener("hashchange", showReport);
showReport();
</script>
