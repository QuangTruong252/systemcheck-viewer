class UnsupportedCompression extends Error {}

function requireValid(condition) {

function shape(value, keys) {
  return value !== null && typeof value === "object" && !Array.isArray(value)

}

function integer(value, max) {
  return Number.isInteger(value) && value >= 0 && value <= max;
}

function ascii(value, max) {
  return typeof value === "string" && value.length <= max && !/[^ -~]/.test(value);
}

function fixedArray(value, length) {
  return Array.isArray(value) && value.length === length;
}

function codeIn(map, value) {

function base64Bytes(encoded) {

  requireValid(btoa(binary).replace(/=+$/, "") === standard);
  return Uint8Array.from(binary, char => char.charCodeAt(0));
}

async function inflate(bytes) {

  const reader = new Blob([bytes]).stream().pipeThrough(stream).getReader();

    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      length += value.length;
      requireValid(length <= maxJson);
      json += decoder.decode(value, { stream: true });
    }
    return json + decoder.decode();
  } catch (error) {
    await reader.cancel().catch(() => {});
    throw error;
  } finally {
    reader.releaseLock();
  }
}

    && keys.every(key => allowedReportKeys.has(key)));
  requireValid(value.v === 1 && (value.cp === 1 || value.cp === 2) && integer(value.ts, 9999999999)
    && (value.pf === "L" || value.pf === "D") && verdicts.includes(value.vd));
  requireValid(shape(value.hw, Object.keys(summaryText)) && Object.values(value.hw).every(item => ascii(item, 20)));
  requireValid(shape(value.ent, ["ep", "loc", "ap"]) && codeIn(endpointText, value.ent.ep)
    && codeIn(localText, value.ent.loc) && value.ent.ap === "UNV");
  requireValid(shape(value.tr, groups) && Object.values(value.tr).every(item => integer(item, 255)));
  if (Object.hasOwn(value, "g")) {
    requireValid(fixedArray(value.g, 7) && value.g.every(gate => integer(gate, 5)));
  }
  if (Object.hasOwn(value, "k")) {
    requireValid(value.k !== null && typeof value.k === "object" && !Array.isArray(value.k));
    const metrics = {};
    for (const [key, metric] of Object.entries(value.k)) {
      requireValid(Number.isInteger(metric) && metric >= 0);
      if (metricKeys.includes(key)) metrics[key] = metric;
    }
    value.k = metrics;
  }
  for (const group of groups) {
    requireValid(Array.isArray(value[group]) && value[group].every(row =>
      (shape(row, ["c"]) || (shape(row, ["c", "m"]) && ascii(row.m, 24)))
      && codeIn(findings, row.c)));
  }
  requireValid(Array.isArray(value.disc) && value.disc.every(code => codeIn(disclosures, code)));
  return value;
}

function minimalReport(tuple) {
  requireValid(fixedArray(tuple, 10));
  const [v, cp, pf, vd, ts, ent, gates, counts, serial, exportFlag] = tuple;
  requireValid(v === 1 && (cp === 1 || cp === 2) && integer(pf, 1)
    && integer(vd, 3) && integer(ts, 9999999999) && exportFlag === 1);
  requireValid(fixedArray(ent, 3) && integer(ent[0], 2) && integer(ent[1], 2) && ent[2] === 2);
  requireValid(fixedArray(gates, 7) && gates.every(gate => integer(gate, 5)));
  requireValid(fixedArray(counts, 3) && counts.every(count => integer(count, 255)));
  requireValid(typeof serial === "string" && serial.length <= 8 && !/[^A-Za-z0-9-]/.test(serial));
  return {
    cp, pf: pf === 0 ? "L" : "D", vd: verdicts[vd], ts,
    hw: { sn: serial },
    ent: { ep: ["OK", "INC", "SKIP_OFFLINE"][ent[0]], loc: ["OK", "WARN", "DB"][ent[1]], ap: "UNV" },
    gates, counts
  };
}

async function decodeReport(hash) {
  requireValid(hash.length <= maxUrl);
  if (hash.startsWith("#v1m.")) {
    const bytes = base64Bytes(hash.slice(5));
    requireValid(bytes.length <= 71 && bytes.every(byte => byte < 128));
    const json = new TextDecoder().decode(bytes);
    const tuple = JSON.parse(json);
    requireValid(JSON.stringify(tuple) === json);
    return minimalReport(tuple);
  }
  requireValid(hash.startsWith("#v1."));
  return fullReport(JSON.parse(await inflate(base64Bytes(hash.slice(4)))));
}

function add(parent, tag, label, className) {
  const element = document.createElement(tag);
  if (label !== undefined) element.textContent = label;
  if (className) element.className = className;
  parent.append(element);
  return element;
}

function panel(parent, title) {
  const section = add(parent, "section");
  add(section, "h2", title);
  return section;
}

function details(parent, rows) {
  const list = add(parent, "dl");
  for (const [label, text] of rows) {
    const row = add(list, "div");
    add(row, "dt", label);
    add(row, "dd", text);
  }
  return list;
}

function countText(count) {
  return count === 255 ? "255+" : String(count);
}

function formatInt(n) {
  return String(Math.trunc(n)).replace(/\B(?=(\d{3})+(?!\d))/g, THIN_SPACE);
}

function formatDecimalNoTrailingZero(value) {
  return value.toFixed(1).replace(/\.0$/, "");
}

function formatRamSummary(ram) {
  if (!ram) return "";
  const match = /^(\d+)\s*MiB$/i.exec(ram.trim());
  if (!match) return ram.trim();
  const gib = Number(match[1]) / 1024;
  return (Number.isInteger(gib) ? String(gib) : formatDecimalNoTrailingZero(gib)) + "G";
}

function formatRamDetail(ram) {
  if (!ram) return "";
  const match = /^(\d+)\s*MiB$/i.exec(ram.trim());
  if (!match) return ram.trim();
  const mib = Number(match[1]);
  if (mib % 1024 === 0) return (mib / 1024) + " GiB";
  return (mib / 1024).toFixed(1) + " GiB (" + formatInt(mib) + " MiB)";
}

function formatDiskSummary(disk) {
  if (!disk) return "";
  const match = /^(\d+)\s*GB$/i.exec(disk.trim());
  if (!match) return disk.trim();
  const gb = Number(match[1]);
  if (gb >= 1000) return formatDecimalNoTrailingZero(gb / 1000) + "TB";
  return gb + "GB";
}

function displayClass(dx) {
  if (dx >= 3800) return "4K";
  if (dx >= 2800) return "3K";
  if (dx >= 2500) return "2.5K";
  if (dx >= 1900) return "FHD";
  if (dx >= 1360) return "HD+";
  return "HD";
}

function formatDisplaySummary(k) {
  if (!k) return "";
  const parts = [];
  if (k.dx > 0) parts.push(displayClass(k.dx));
  if (k.dh > 0) parts.push(k.dh + "Hz");
  return parts.join(" ");
}

function formatAge(days) {
  if (days >= 365) return "~" + Math.round(days / 365) + " năm";
  return Math.max(1, Math.round(days / 30)) + " tháng";
}

function formatWritten(gb) {
  if (gb >= 1000) return formatDecimalNoTrailingZero(gb / 1000) + " TB";
  return formatInt(gb) + " GB";
}

function buildMetricsRows(k) {
  if (!k) return [];
  const rows = [];
  if (Object.hasOwn(k, "bw")) rows.push(["Độ chai pin", k.bw + " %"]);
  if (Object.hasOwn(k, "bc")) rows.push(["Chu kỳ sạc", formatInt(k.bc)]);
  if (Object.hasOwn(k, "sh")) rows.push(["SMART còn lại", k.sh + " %"]);
  if (Object.hasOwn(k, "ph")) rows.push(["Giờ chạy ổ", formatInt(k.ph) + " h"]);
  if (Object.hasOwn(k, "tw")) rows.push(["Đã ghi", formatWritten(k.tw)]);
  if (Object.hasOwn(k, "cm")) {
    if (Object.hasOwn(k, "cb") && k.cb > 0) {
      const pct = Math.round((k.cm * 100) / k.cb);
      rows.push(["Xung CPU dưới tải", formatInt(k.cm) + " / " + formatInt(k.cb) + " MHz (" + pct + "%)"]);
    } else {
      rows.push(["Xung CPU dưới tải", formatInt(k.cm) + " MHz"]);
    }
  } else if (Object.hasOwn(k, "cb") && k.cb > 0) {
    rows.push(["Xung gốc CPU", formatInt(k.cb) + " MHz"]);
  }
  if (Object.hasOwn(k, "gt")) rows.push(["Nhiệt GPU cao nhất", k.gt + " °C"]);
  if (Object.hasOwn(k, "ru")) rows.push(["RAM khả dụng", (k.ru / 1024).toFixed(1) + " GiB"]);
  if (Object.hasOwn(k, "wc")) rows.push(["WHEA 30 ngày", formatInt(k.wc)]);
  if (Object.hasOwn(k, "wf")) rows.push(["WHEA Fatal 90 ngày", formatInt(k.wf)]);
  if (Object.hasOwn(k, "dh")) rows.push(["Màn hình", formatInt(k.dh) + " Hz"]);
  if (Object.hasOwn(k, "ag")) rows.push(["Tuổi máy", formatAge(k.ag)]);
  return rows;
}

const manualItems = Object.freeze({
  BATTERY_CASE: "Pin phồng / vỏ cong",
  SCREWS_SEALS: "Ốc / tem",
  PORTS: "Cổng kết nối",
  WEBCAM: "Webcam",
  WI_FI: "Wi-Fi"
});

function factoryLookup({ model, sn }) {
  // 2026-11-26: #v1m has sn8 but no vendor. Use only the full #v1 hardware summary.
  if (!model || !sn) return null;
  const serial = sn.trim().toUpperCase();
  const name = model.trim();
  // 2026-11-26: Lenovo PC Support redirected /products/{serial}/parts/display/as-built
  // to the canonical product's As-Built page on https://pcsupport.lenovo.com/ (HTTP 200).
  if (/^lenovo(?:\s|$)/i.test(name) && /^[A-Z0-9]{7,8}$/.test(serial)) {
    return {
      url: "https://pcsupport.lenovo.com/us/en/products/" + serial + "/parts/display/as-built"
    };
  }
  // 2026-11-26: Dell KB 000125283 documents Product Specifications > Original Configuration.
  // https://www.dell.com/support/kbdoc/en-us/000125283 (direct tag GET returned HTTP 403 here).
  if (/^dell(?:\s|$)/i.test(name) && /^[A-Z0-9]{7}$/.test(serial)) {
    return {
      url: "https://www.dell.com/support/product-details/en-us/servicetag/" + serial + "/overview",
      hint: "Chọn Product Specifications, rồi chọn Original Configuration."
    };
  }
  // HP PartSurfer reads searchtext from the URL and accepts a full 10-character serial.
  // https://partsurfer.hpcloud.hp.com/PartSurfer/UserGuide (2026-11-26)
  if (/^(?:hp|hewlett[- ]packard)(?:\s|$)/i.test(name) && /^[A-Z0-9]{10}$/.test(serial)) {
    return {
      url: "https://partsurfer.hpcloud.hp.com/?searchtext=" + serial,
      hint: "Mở thẻ Advanced để xem danh sách linh kiện nếu có."
    };
  }
  return null;
}

function renderBanner(view, report) {
  const head = add(view, "div", undefined, "report-head");
  add(head, "h2", report.cp === 1 ? "Báo cáo sơ bộ" : "Báo cáo hoàn chỉnh");
  const timestamp = new Date(report.ts * 1000).toISOString().slice(0, 19).replace("T", " ") + " UTC";
  const metaParts = [report.hw.model, report.pf === "L" ? "Laptop" : "Máy để bàn", timestamp].filter(Boolean);
  add(head, "p", metaParts.join(" · "), "detail");

  const banner = add(view, "section", undefined, "banner " + report.vd);
  const top = add(banner, "div", undefined, "banner-top");
  add(top, "p", verdictText[report.vd], "verdict " + report.vd);

  const counts = report.counts
    ? report.counts
    : [report.db.length, report.unv.length, report.wn.length];
  const [dbN, unvN, wnN] = counts;
  if (dbN + unvN + wnN > 0) {
    let badgeText = "";
    let badgeClass = report.vd;
    if (dbN === 0 && unvN === 0 && wnN > 0) {
      badgeText = "Kèm " + wnN + " lưu ý";
      badgeClass = "WARN";
    } else if (report.vd === "INC" && wnN > 0 && dbN === 0) {
      badgeText = "Kèm " + wnN + " lưu ý";
      badgeClass = "WARN";
    } else {
      const parts = [];
      if (dbN > 0) parts.push(dbN + " loại");
      if (unvN > 0) parts.push(unvN + " chưa đủ");
      if (wnN > 0) parts.push(wnN + " lưu ý");
      badgeText = parts.join(" · ");
    }
    add(top, "span", badgeText, "chip " + badgeClass);
  }

  const sub = report.vd === "INC" && wnN > 0
    ? "Một số hạng mục chưa đủ dữ liệu; có mục cần lưu ý đàm phán."
    : verdictSummary[report.vd];
  add(banner, "p", sub, "banner-sub");
  if (report.cp === 1) {
    add(banner, "p", "Kết quả sau quét cấu hình và nhật ký. Kiểm tra ngoại vi và tải chưa chạy.", "banner-note");
  }
}

function renderConfigSummary(view, report) {
  const hw = report.hw;
  const summaryParts = [
    hw.cpu,
    hw.gpu,
    formatRamSummary(hw.ram),
    formatDiskSummary(hw.disk),
    formatDisplaySummary(report.k)
  ].filter(Boolean);

  const detailRows = [];
  if (hw.model) detailRows.push([summaryText.model, hw.model]);
  if (hw.sn) detailRows.push([summaryText.sn, hw.sn]);
  if (hw.cpu) detailRows.push([summaryText.cpu, hw.cpu]);
  if (hw.gpu) detailRows.push([summaryText.gpu, hw.gpu]);
  if (hw.ram) detailRows.push([summaryText.ram, formatRamDetail(hw.ram)]);
  if (hw.disk) detailRows.push([summaryText.disk, hw.disk]);
  if (report.k && report.k.dx > 0 && report.k.dy > 0) {
    detailRows.push(["Độ phân giải", report.k.dx + "×" + report.k.dy]);
  }
  const lookup = factoryLookup(hw);

  if (!summaryParts.length && !detailRows.length && !lookup) return;

  const section = add(view, "section", undefined, "config-panel");
  const line = summaryParts.length
    ? summaryParts.join(" / ")
    : hw.sn
      ? "Serial: " + hw.sn
      : hw.model || "";
  if (line) add(section, "p", line, "config-line");

  if (detailRows.length || lookup) {
    const expander = add(section, "details", undefined, "config-details");
    add(expander, "summary", "Chi tiết cấu hình");
    if (detailRows.length) details(expander, detailRows);
    if (lookup) {
      const link = add(add(expander, "p", undefined, "lookup-row"), "a", "Tra cấu hình xuất xưởng");
      link.href = lookup.url;
      link.target = "_blank";
      link.rel = "noopener noreferrer";
      if (lookup.hint) add(expander, "p", lookup.hint, "detail");
    }
  }
}

function renderGates(view, gates) {
  if (!gates) return;
  const section = panel(view, "Hạng mục kiểm tra");
  const list = add(section, "dl");
  gates.forEach((gate, index) => {
    const row = add(list, "div");
    add(row, "dt", gateNames[index]);
    const cell = add(row, "dd");
    add(cell, "span", gateText[gate], "chip " + gateClasses[gate]);
  });
}

function renderFindings(view, report) {
  if (report.gates) {
    if (report.counts.some(count => count > 0)) {
      const summary = panel(view, "Số mục phát hiện");
      details(summary, groups.map((group, index) => [groupText[group], countText(report.counts[index])]));
      add(summary, "p", "Xuất file báo cáo từ SystemCheck trên PC để xem chi tiết.", "detail omitted-note");
    }
    return;
  }

  const items = [];
  for (const group of groups) {
    for (const row of report[group]) items.push({ group, row });
  }
  const omittedGroups = groups.filter(group => report.tr[group] > 0);
  if (!items.length && !omittedGroups.length) return;

  const section = panel(view, "Cần chú ý");
  if (items.length) {
    const list = add(section, "ul", undefined, "findings-list");
    for (const { group, row } of items) {
      const li = add(list, "li");
      add(li, "p", findings[row.c], "finding-desc");
      const item = row.c === "PERIPH_DEFECT" && Object.hasOwn(manualItems, row.m)
        ? manualItems[row.m] : row.m;
      const meta = add(li, "p", undefined, "finding-meta");
      add(meta, "span", severityChipText[group], "chip chip-sm " + severityChipClass[group]);
      add(meta, "span", row.c + (item === undefined ? "" : " · " + item), "code-text");
      const action = statusActionCodes.has(row.c)
        ? actions[row.c]
        : (item !== undefined && Object.hasOwn(actions, item) && actions[item])
          || (Object.hasOwn(actions, row.c) && actions[row.c]);
      if (action) {
        const line = add(li, "p", undefined, "finding-action");
        add(line, "strong", "Việc cần làm: ");
        add(line, "span", action);
      }
    }
  }
  for (const group of omittedGroups) {
    add(section, "p", groupText[group] + ": Đã lược " + countText(report.tr[group]) + " mục.", "detail omitted-note");
  }
  if (omittedGroups.length) {
    add(section, "p", "Xuất file báo cáo từ SystemCheck trên PC để xem chi tiết.", "detail omitted-note");
  }
}

function renderMetrics(view, k) {
  const rows = buildMetricsRows(k);
  if (!rows.length) return;
  details(panel(view, "Số đo chính"), rows);
}

function renderManagement(view, ent) {
  const section = panel(view, "Quản trị thiết bị");
  const list = add(section, "dl");
  for (const [label, value] of [
    ["Máy chủ Microsoft", endpointText[ent.ep]],
    ["Trạng thái cục bộ", localText[ent.loc]]
  ]) {
    const row = add(list, "div");
    add(row, "dt", label);
    add(row, "dd", value);
  }
  const apRow = add(list, "div");
  add(apRow, "dt", "Autopilot Cloud");
  add(add(apRow, "dd"), "span", "Chưa xác minh", "chip INC");
}

function render(report) {
  const view = document.createDocumentFragment();
  // §7.5 order: verdict banner -> one-line config summary -> 7 gates -> merged findings -> metrics -> management -> disclosures.
  renderBanner(view, report);
  renderConfigSummary(view, report);
  renderGates(view, report.gates || report.g);
  renderFindings(view, report);
  renderMetrics(view, report.k);
  renderManagement(view, report.ent);
  if (report.disc && report.disc.length) {
    const list = add(panel(view, "Phạm vi kiểm tra"), "ul", undefined, "disc-list");
    for (const code of report.disc) add(list, "li", disclosures[code]);
  }
  return view;
}

const status = document.getElementById("status");
const output = document.getElementById("report");
let revision = 0;

async function showReport() {
  const current = ++revision;
  const hash = location.hash;
  output.replaceChildren();
  if (!hash) {
    status.textContent = "Quét mã QR trong SystemCheck để mở báo cáo.";
    return;
  }
  status.textContent = "Đang đọc báo cáo…";
  try {
    if (location.protocol === "https:") {
      requireValid(location.href.length <= maxUrl && location.href.length - hash.length + 1 <= maxPrefix);
    }
    const report = await decodeReport(hash);
    if (current !== revision) return;
    output.replaceChildren(render(report));
    status.textContent = "Đã đọc báo cáo trên thiết bị này.";
  } catch (error) {
    if (current !== revision) return;
    status.textContent = error instanceof UnsupportedCompression
      ? "Trình duyệt này chưa hỗ trợ giải nén báo cáo. Hãy mở mã QR bằng trình duyệt mới hơn hoặc xuất file từ PC."
      : "Mã QR không hợp lệ hoặc chưa được hỗ trợ.";
  }
}
window.addEventListener("hashchange", showReport);
showReport();
</script>
